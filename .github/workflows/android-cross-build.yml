# ============================================================================
# obscura-android-cross-build.yml — v3 (experimental, iterando)
# Cross-compila Obscura para aarch64-linux-android (bionic/NDK r27c).
#
# Contexto (AUDITORIA-01-obscura-android10.md):
#  * Binarios glibc mueren con SIGSYS por seccomp de Android 10 → bionic.
#  * obscura-js → deno_core 0.412 → V8 150.4.0 desde fuente (sin prebuilt).
#  * obscura-js/build.rs espera el build GN con mksnapshot cross en
#    gn_out/clang_x64_v8_arm64/ (--target_arch=arm64 --target_os=android).
#
# Historial de iteraciones:
#  v1: cargo-ndk -t arm64        → CLI rechaza (arm64-v8a es el valor válido)
#  v2: cargo-ndk -t arm64-v8a    → panic "unknown package: 24" (-p no es
#      platform en v4.1.2) → v3 prescinde de cargo-ndk: linker directo
#      en .cargo/config.toml (más robusto y auditable).
# ============================================================================

name: obscura-android-cross-build

on:
  workflow_dispatch:

jobs:
  cross-build:
    runs-on: ubuntu-latest # 4 vCPU / 16 GB RAM
    timeout-minutes: 180
    env:
      ANDROID_API: "24" # min API razonable para Termux moderno
    steps:
      - uses: actions/checkout@v4

      - name: Liberar disco (el runner trae SDK Android preinstalado que no usamos)
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Instalar NDK r27c
        run: |
          mkdir -p "$HOME/ndk"
          curl -sSLo "$HOME/ndk/ndk.zip" \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q "$HOME/ndk/ndk.zip" -d "$HOME/ndk"
          echo "ANDROID_NDK_HOME=$HOME/ndk/android-ndk-r27c" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$HOME/ndk/android-ndk-r27c" >> "$GITHUB_ENV"
          "$HOME/ndk/android-ndk-r27c/ndk-build" --version | head -1

      - name: Rust + target bionic
        run: |
          rustup target add aarch64-linux-android
          rustc --version

      - name: depot_tools (requisito de V8/GN)
        run: |
          git clone --depth 1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: Configurar enlazador bionic (.cargo/config.toml)
        run: |
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p .cargo
          {
            echo "[target.aarch64-linux-android]"
            echo "linker = \"$TC/aarch64-linux-android${ANDROID_API}-clang\""
          } > .cargo/config.toml
          cat .cargo/config.toml

      - name: Build obscura-cli (obscura + obscura-worker) arm64 bionic
        run: |
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android${ANDROID_API}-clang"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          # V8 desde fuente: rusty_v8 compila vía GN/ninja. En cross android,
          # iterar aquí los args que obscura-js/build.rs espera (§3.3.3).
          export V8_FROM_SOURCE=1
          cargo build --release --target aarch64-linux-android -p obscura-cli

      - name: Verificación básica del ELF (bionic, no glibc)
        run: |
          file target/aarch64-linux-android/release/obscura || true
          readelf -d target/aarch64-linux-android/release/obscura | grep -E "NEEDED" | head -5

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: obscura-android-arm64
          path: |
            target/aarch64-linux-android/release/obscura
            target/aarch64-linux-android/release/obscura-worker
          if-no-files-found: warn

  # NOTA: el smoke test NO se automatiza en CI (un self-hosted runner sería
  # glibc y moriría con SIGSYS en el dispositivo). Prueba real manual:
  # 1) artefacto al teléfono → 2) Termux: chmod +x obscura && ./obscura --help
  #    (si muere con señal 31 → revisar syscalls) → 3) ~/nodo/bin/obscura

